package:
  name: sqld
  build:
    # Warnings are errors. A missing formatter case is already a hard type
    # error, so what this catches is the quieter class — unused imports,
    # shadowed names, bindings introduced and never used — which a warning
    # only stops if somebody reads the build output.
    strict: true
  publish:
    version: "0.1.0"
    license: "MIT"
    location:
      githubOwner: "plooney81"
      githubRepo: "purescript-sqld"
  dependencies:
    - arrays
    - console
    - effect
    - foldable-traversable
    - maybe
    - prelude
    - strings
    - tuples
  run:
    main: Example.Main
  test:
    main: Test.Main
    # Test sources are held to the same standard as the library: see the note
    # on `build.strict` above.
    strict: true
    dependencies:
      - aff
      - console
      - effect
      - integers
      - lcg
      - node-buffer
      - node-fs
      - node-process
      - quickcheck
      - spec
      - spec-node

workspace:
  packageSet:
    # Run `spago registry package-sets` to find the latest available version.
    registry: "75.6.0"
