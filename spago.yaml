package:
  name: sqld
  publish:
    version: "0.1.0"
    license: "MIT"
    location:
      githubOwner: "plooney81"
      githubRepo: "purescript-sqld"
  dependencies:
    - arrays
    - console
    - effect
    - foldable-traversable
    - maybe
